<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popin - طلب حذف الحساب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-delete {
            width: 100%;
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
            text-align: center;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>حذف حساب Popin</h2>
    <p>عند حذف حسابك، سيتم حذف جميع بياناتك الشخصية، المحادثات، والملف الشخصي نهائياً وبشكل لا يمكن استرجاعه.</p>
    
    <form id="deleteForm">
        <div class="form-group">
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" required placeholder="أدخل بريدك الإلكتروني">
        </div>
        <div class="form-group">
            <label for="password">كلمة المرور:</label>
            <input type="password" id="password" required placeholder="أدخل كلمة المرور">
        </div>
        <button type="submit" class="btn-delete" id="submitBtn">تأكيد حذف الحساب نهائياً</button>
    </form>

    <div id="statusMessage" class="message"></div>
</div>

<script>
    document.getElementById('deleteForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('statusMessage');

        if (!confirm('هل أنت متأكد من أنك تريد حذف حسابك نهائياً؟')) {
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'جاري المعالجة...';
        messageDiv.style.display = 'none';

        try {
            const response = await fetch('https://popin-api.onrender.com/api/delete-account', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                messageDiv.className = 'message success';
                messageDiv.innerText = 'تم حذف الحساب وجميع البيانات المرتبطة به بنجاح.';
                messageDiv.style.display = 'block';
                document.getElementById('deleteForm').reset();
            } else {
                messageDiv.className = 'message error';
                messageDiv.innerText = data.message || 'حدث خطأ أثناء حذف الحساب. تأكد من البيانات.';
                messageDiv.style.display = 'block';
            }
        } catch (error) {
            messageDiv.className = 'message error';
            messageDiv.innerText = 'تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً.';
            messageDiv.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'تأكيد حذف الحساب نهائياً';
        }
    });
</script>

</body>
</html>
